<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - Smart Learning Engine</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .course-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            background: rgba(30, 41, 59, 0.8);
        }

        .course-card:hover::before {
            opacity: 1;
        }

        .course-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
            align-items: flex-start;
        }

        .course-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .color-1 { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .color-2 { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        .color-3 { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); }
        .color-4 { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }

        .course-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 0.25rem;
        }

        .course-category {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .course-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .progress-section {
            margin-top: auto;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 1s ease-in-out;
            position: relative;
        }
        
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        .btn-action {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-action:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .enrolled-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.4);
        }

        .skeleton-loader {
            height: 250px;
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.5) 25%, rgba(40, 53, 75, 0.5) 50%, rgba(30, 41, 59, 0.5) 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 16px;
        }

        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="graduation-cap" style="color: #10b981;"></i>
                Smart Learning Engine
            </div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> My Dashboard
                </a>
                <a href="student-courses.html" class="nav-item active">
                    <i data-lucide="book-open"></i> My Courses
                </a>
                <a href="student-achievements.html" class="nav-item">
                    <i data-lucide="award"></i> Achievements
                </a>
                <a href="student-profile.html" class="nav-item">
                    <i data-lucide="user"></i> Profile
                </a>
            </nav>
            <div style="margin-top: auto;">
                <a href="#" id="logoutBtn" class="nav-item">
                    <i data-lucide="log-out"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h2>Course Catalog</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">View and manage your enrolled courses and progress.</p>
                </div>
                <div class="header-actions">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);">
                        <span id="student-initials">S</span>
                    </div>
                </div>
            </div>

            <div class="filter-buttons" id="categoryFilters">
                <button class="filter-btn active" data-filter="all">All Courses</button>
                <button class="filter-btn" data-filter="enrolled">My Enrolled</button>
                <button class="filter-btn" data-filter="Software">Software</button>
                <!-- Categories will be populated dynamically if needed -->
            </div>

            <div id="courseGrid" class="course-grid">
                <!-- Skeletons shown during loading -->
                <div class="skeleton-loader"></div>
                <div class="skeleton-loader"></div>
                <div class="skeleton-loader"></div>
                <div class="skeleton-loader"></div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const studentId = localStorage.getItem('studentId');
            if (!studentId) {
                window.location.href = 'student-login.html';
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.clear();
                window.location.href = 'student-login.html';
            });

            // Make sure the initials are available from storage or fetch profile if needed
            fetch(`http://localhost:8080/api/students/${studentId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('student-initials').textContent = data.name ? data.name.charAt(0).toUpperCase() : 'S';
                }).catch(e => console.error(e));

            const courseGrid = document.getElementById('courseGrid');
            let allCourses = [];

            try {
                const response = await fetch('http://localhost:8080/api/courses');
                if(!response.ok) throw new Error("Failed to fetch courses");
                allCourses = await response.json();
                
                renderCourses(allCourses);

            } catch(error) {
                courseGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--bg-card); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--danger); margin-bottom: 1rem;"></i>
                        <h3 style="margin-bottom: 0.5rem;">Could not load courses</h3>
                        <p style="color: var(--text-muted);">${error.message}. Is your backend running?</p>
                    </div>
                `;
                lucide.createIcons();
            }

            // Filter logic
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const category = btn.getAttribute('data-filter');
                    
                    if (category === 'all') {
                        renderCourses(allCourses);
                    } else if (category === 'enrolled') {
                        // We uniquely assign a fake enrollment logic for demo purposes
                        const enrolled = allCourses.filter((c, index) => index % 3 === 0);
                        renderCourses(enrolled);
                    } else {
                        const filtered = allCourses.filter(c => c.category === category);
                        renderCourses(filtered);
                    }
                });
            });

            function renderCourses(coursesToRender) {
                courseGrid.innerHTML = '';
                
                if(coursesToRender.length === 0) {
                     courseGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">No courses found for this filter.</div>`;
                     return;
                }

                coursesToRender.forEach((course, index) => {
                    // Generate a visual aesthetic based on index
                    const colorClass = `color-${(index % 4) + 1}`;
                    const isEnrolled = index % 3 === 0; // Simulate some enrolled courses
                    const fakeProgress = isEnrolled ? Math.floor(Math.random() * 80) + 10 : 0;
                    
                    const card = document.createElement('div');
                    card.className = 'course-card';
                    card.innerHTML = `
                        ${isEnrolled ? '<div class="enrolled-badge">Enrolled</div>' : ''}
                        <div class="course-header">
                            <div class="course-icon-wrapper ${colorClass}">
                                ${course.name.substring(0,2).toUpperCase()}
                            </div>
                            <div>
                                <h3 class="course-title">${course.name}</h3>
                                <div class="course-category">${course.category}</div>
                            </div>
                        </div>
                        
                        <div class="course-details">
                            <div class="detail-item">
                                <i data-lucide="layers" style="width: 16px;"></i>
                                ${course.levels} Levels
                            </div>
                            <div class="detail-item">
                                <i data-lucide="clock" style="width: 16px;"></i>
                                ~${course.levels * 4} Hours
                            </div>
                        </div>
                        
                        <div class="progress-section">
                            <div class="progress-header">
                                <span style="color: ${isEnrolled ? 'var(--text-primary)' : 'var(--text-muted)'}">${isEnrolled ? 'Current Progress' : 'Not Started'}</span>
                                <span style="color: ${isEnrolled ? '#10b981' : 'var(--text-muted)'}">${fakeProgress}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: 0%; background: ${isEnrolled ? 'linear-gradient(90deg, #10b981, #3b82f6)' : 'rgba(255,255,255,0.2)'};"></div>
                            </div>
                        </div>
                        
                        <button class="btn-action">
                            ${isEnrolled ? '<i data-lucide="play-circle" style="width: 18px;"></i> Resume Course' : '<i data-lucide="plus" style="width: 18px;"></i> Enroll Now'}
                        </button>
                    `;
                    courseGrid.appendChild(card);

                    // Animate progress bar after attachment
                    setTimeout(() => {
                        const bar = card.querySelector('.progress-bar-fill');
                        if(bar) bar.style.width = fakeProgress + '%';
                    }, 100);
                });

                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
