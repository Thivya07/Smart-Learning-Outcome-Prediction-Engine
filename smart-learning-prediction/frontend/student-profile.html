<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Smart Learning Engine</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(145deg, var(--bg-card) 0%, rgba(30, 41, 59, 1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-top: 2rem;
        }

        .profile-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 160px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 0;
        }

        .profile-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            gap: 2rem;
            margin-bottom: 3rem;
            margin-top: 40px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: 4px solid var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .profile-avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid var(--bg-card);
            transition: all 0.2s;
        }

        .profile-avatar-edit:hover {
            transform: scale(1.1);
            background: #059669;
        }

        .profile-title h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .profile-title p {
            color: #cbd5e1;
            font-size: 1rem;
        }

        .profile-form {
            position: relative;
            z-index: 1;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-input[readonly], .form-input:disabled {
            background: rgba(255,255,255,0.02);
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: transparent;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 2.5rem;
            gap: 1rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .profile-header { flex-direction: column; align-items: center; text-align: center; }
        }

        /* Success Message Overlay */
        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 500;
            display: flex; align-items: center; gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="graduation-cap" style="color: #10b981;"></i>
                Smart Learning Engine
            </div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> My Dashboard
                </a>
                <a href="student-courses.html" class="nav-item">
                    <i data-lucide="book-open"></i> My Courses
                </a>
                <a href="student-achievements.html" class="nav-item">
                    <i data-lucide="award"></i> Achievements
                </a>
                <a href="student-profile.html" class="nav-item active">
                    <i data-lucide="user"></i> Profile
                </a>
            </nav>
            <div style="margin-top: auto;">
                <a href="#" id="logoutBtn" class="nav-item">
                    <i data-lucide="log-out"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header" style="margin-bottom: 0;">
                <div>
                    <h2>Account Settings</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Manage your personal profile and security preferences.</p>
                </div>
            </div>

            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <span id="avatarInitials">ST</span>
                        <div class="profile-avatar-edit">
                            <i data-lucide="camera" style="width: 16px; color: white;"></i>
                        </div>
                    </div>
                    <div class="profile-title">
                        <h2 id="displayTitleName">Loading...</h2>
                        <p id="displayDeptID">Loading department...</p>
                    </div>
                </div>

                <form class="profile-form" id="profileForm">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="profName" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="profEmail" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Update Password</label>
                            <input type="password" id="profPassword" class="form-input" placeholder="Leave blank to keep same">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Department</label>
                            <input type="text" id="profDept" class="form-input" disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Current CGPA (Locked)</label>
                            <input type="text" id="profCgpa" class="form-input" disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Unit Test Average (Locked)</label>
                            <input type="text" id="profUt" class="form-input" disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Assessment Grade (Locked)</label>
                            <input type="text" id="profAssess" class="form-input" disabled>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="window.location.reload()">Discard Changes</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i data-lucide="save" style="width: 18px;"></i>
                            Save Profile
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="successToast">
        <i data-lucide="check-circle"></i>
        <span>Profile updated successfully!</span>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const studentId = localStorage.getItem('studentId');
            if(!studentId) { window.location.href = 'student-login.html'; return; }

            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.clear();
                window.location.href = 'student-login.html';
            });

            // Store original data
            let originalData = {};

            try {
                const response = await fetch(`http://localhost:8080/api/students/${studentId}`);
                if(!response.ok) throw new Error("Could not fetch profile");
                originalData = await response.json();

                // Populate UI
                document.getElementById('avatarInitials').textContent = originalData.name ? originalData.name.charAt(0).toUpperCase() : 'ST';
                document.getElementById('displayTitleName').textContent = originalData.name;
                document.getElementById('displayDeptID').textContent = `${originalData.department || 'General'} • ID: #${originalData.id}`;

                document.getElementById('profName').value = originalData.name || '';
                document.getElementById('profEmail').value = originalData.email || '';
                
                document.getElementById('profDept').value = originalData.department || '';
                document.getElementById('profCgpa').value = (originalData.cgpa || 0).toFixed(2);
                document.getElementById('profUt').value = (originalData.utScore || 0) + '%';
                document.getElementById('profAssess').value = (originalData.assessmentScore || 0) + '%';

            } catch(e) { console.error('Error fetching profile:', e); }

            // Handle Save Profile
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Saving...';
                
                const updatedData = {
                    ...originalData, // carry over locked fields so we don't nullify them
                    name: document.getElementById('profName').value.trim(),
                    email: document.getElementById('profEmail').value.trim()
                };

                const newPassword = document.getElementById('profPassword').value.trim();
                if(newPassword) {
                    updatedData.password = newPassword;
                }

                try {
                    const putResp = await fetch(`http://localhost:8080/api/students/${studentId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });

                    if(putResp.ok) {
                        const savedStudent = await putResp.json();
                        originalData = savedStudent; // update local cache

                        // Update Visuals manually
                        document.getElementById('avatarInitials').textContent = savedStudent.name ? savedStudent.name.charAt(0).toUpperCase() : 'ST';
                        document.getElementById('displayTitleName').textContent = savedStudent.name;

                        // Clear password field
                        document.getElementById('profPassword').value = '';

                        // Show success toast
                        const toast = document.getElementById('successToast');
                        toast.classList.add('show');
                        setTimeout(() => toast.classList.remove('show'), 3000);
                        
                    } else {
                        alert("Failed to update profile due to an error.");
                    }
                } catch(error) {
                    alert("Network error updating profile.");
                } finally {
                    saveBtn.innerHTML = '<i data-lucide="save" style="width: 18px;"></i> Save Profile';
                    lucide.createIcons();
                }
            });
        });
    </script>
</body>
</html>
